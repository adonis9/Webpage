<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Horse Draw Manager - Fixed Heats</title>
<style>
body { font-family: Arial, sans-serif; background:#f4f6f8; padding:20px; }
h1 { text-align:center; }
.section { background:white; padding:15px; margin-bottom:20px; border-radius:8px; }
input, select, textarea, button { width:100%; padding:8px; margin:5px 0; }
button { background:#2c3e50; color:white; border:none; cursor:pointer; }
.delete { background:#e74c3c; }
.draw { background:#27ae60; }
.race { border:1px solid #ddd; padding:10px; margin-top:10px; border-radius:5px; }
.horse-item { display:flex; justify-content:space-between; margin-bottom:3px; }
</style>
</head>
<body>

<div id="lockScreen" style="text-align:center; margin-top:120px;">
  <h2>🔒 Private Page</h2>
  <input type="password" id="accessCode" placeholder="Access code">
  <button onclick="unlock()">Enter</button>
  <p id="error" style="color:red;"></p>
</div>

<div id="appContent" style="display:none;">

<h1>🐎 Horse Draw Manager</h1>
<button class="delete" onclick="deleteAll()">Delete All Data</button>

<div class="section">
<h2>Add Horses</h2>
<textarea id="horseNames" placeholder="One horse per line"></textarea>
<select id="houseSelect"></select>
<input id="newHouse" placeholder="Or new house name">
<button onclick="addHorses()">Add Horse(s)</button>
</div>

<div class="section">
<h2>Horse List</h2>
<div id="horseList"></div>
</div>

<div class="section">
<h2>🏁 Draw Results</h2>
<button class="draw" onclick="generateAutoDraw()">Generate Draw</button>
<div id="drawResults"></div>
</div>

</div>

<script>
const SECRET_CODE = "HORSE2026";
let horses = [
  {name:"Sabe Na Mundo", house:"Koxera Monte Barro"},
  {name:"Arbisa", house:"Koxera Monte Barro"},
  {name:"Pisadelo", house:"Koxera Monte Barro"},
  {name:"Fradu Fra", house:"Koxera Monte Barro"},
  {name:"Forca Imigrante", house:"Koxera Nene Lapinha"},
  {name:"America Dreams", house:"Koxera Nene Lapinha"},
  {name:"Bless", house:"Koxera Nene Lapinha"},
  {name:"Miss Fogo", house:"Koxera Lele"},
  {name:"Rainha Das Ilhas", house:"Clube Juvenil"},
  {name:"Mestre Moita", house:"Koxera de Neto"},
  {name:"Showtime", house:"Koxera de Neto"},
  {name:"Santiago Sweetie", house:"EECV"},
  {name:"Djabraba BAYC", house:"EECV"},
  {name:"Eytiana", house:"EECV"},
  {name:"Comandate", house:"EECV"},
  {name:"Cidade velha", house:"EECV"},
  {name:"Stylish", house:"EECV"}
];

function unlock(){
  if(document.getElementById("accessCode").value === SECRET_CODE){
    document.getElementById("lockScreen").style.display="none";
    document.getElementById("appContent").style.display="block";
    load();
  } else {
    document.getElementById("error").innerText="Wrong code";
  }
}

function save(){
  localStorage.setItem("horses", JSON.stringify(horses));
}

function load(){
  let saved = JSON.parse(localStorage.getItem("horses"));
  if(saved && saved.length>0) horses = saved;
  updateHouses();
  renderHorseList();
}

function updateHouses(){
  const select = document.getElementById("houseSelect");
  const houses = [...new Set(horses.map(h=>h.house))];
  select.innerHTML="";
  houses.forEach(h=>{
    let o=document.createElement("option");
    o.value=h;
    o.textContent=h;
    select.appendChild(o);
  });
}

function addHorses(){
  let house = document.getElementById("newHouse").value.trim() || document.getElementById("houseSelect").value;
  if(!house) return alert("Enter house");

  document.getElementById("horseNames").value.split("\n").forEach(n=>{
    n=n.trim();
    if(n) horses.push({name:n, house});
  });

  document.getElementById("horseNames").value="";
  document.getElementById("newHouse").value="";
  save();
  updateHouses();
  renderHorseList();
}

function removeHorse(i){
  horses.splice(i,1);
  save();
  renderHorseList();
}

function renderHorseList(){
  const div = document.getElementById("horseList");
  div.innerHTML="";
  horses.forEach((h,i)=>{
    div.innerHTML += `${h.name} (${h.house}) <button onclick="removeHorse(${i})">X</button><br>`;
  });
}

function shuffle(arr){
  return arr.sort(()=>Math.random()-0.5);
}

// Improved Draw Logic for 2-3 horses per race, all included, no same-house clashes
function generateAutoDraw(){
  const out = document.getElementById("drawResults");
  out.innerHTML="";

  if(horses.length < 2) return;

  let houseMap = {};
  horses.forEach(h=>{
    if(!houseMap[h.house]) houseMap[h.house] = [];
    houseMap[h.house].push(h);
  });

  let houses = Object.keys(houseMap);
  houses.forEach(h => houseMap[h] = shuffle(houseMap[h]));

  let heats = [];
  while(true){
    let available = houses.filter(h => houseMap[h].length > 0);
    if(available.length === 0) break;

    let remaining = Object.values(houseMap).reduce((a,b)=>a+b.length,0);
    let size = (remaining <=3) ? remaining : (remaining===4 ? 2 : 3);
    size = Math.min(size, available.length);
    if(size < 2) break;

    let chosen = shuffle([...available]).slice(0, size);
    let heat = chosen.map(h => houseMap[h].pop());
    heats.push(heat);
  }

  let leftover = Object.values(houseMap).flat();
  if(leftover.length === 1 && heats.length){
    let lastHeat = heats.find(h => h.length === 2);
    if(lastHeat) lastHeat.push(leftover[0]);
    else heats[heats.length-1].push(leftover[0]);
  }

  heats.forEach((h,i)=>{
    out.innerHTML += `<div class="race"><b>Race ${i+1}</b><ul>`;
    h.forEach(x=>{
      out.innerHTML += `<li>${x.name} (${x.house})</li>`;
    });
    out.innerHTML += "</ul></div>";
  });
}

function deleteAll(){
  localStorage.clear();
  location.reload();
}
</script>

</body>
</html>
